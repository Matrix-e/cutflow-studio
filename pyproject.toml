[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutflow-studio"
version = "0.4.1"
description = "Local-first talking-head edit, review and enterprise video delivery"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "python-multipart>=0.0.9,<1", "paramiko>=3.4,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.51,<2"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
